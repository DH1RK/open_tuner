name: Label hardware

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const m = body.match(/### Hardware\s+([^\n]+)/);
            if (!m) return;
            const hw = m[1].trim();
            const map = {
              'MiniTiouner Pro': 'hw:pro',
              'MiniTiouner V2': 'hw:v2',
              'Other': 'hw:other',
            };
            const key = Object.keys(map).find(k => hw.startsWith(k));
            if (!key) return;
            const all = Object.values(map);
            const current = context.payload.issue.labels.map(l => l.name);
            for (const l of current.filter(n => all.includes(n) && n !== map[key])) {
              await github.rest.issues.removeLabel({...context.repo, issue_number: context.issue.number, name: l});
            }
            if (!current.includes(map[key])) {
              await github.rest.issues.addLabels({...context.repo, issue_number: context.issue.number, labels: [map[key]]});
            }
